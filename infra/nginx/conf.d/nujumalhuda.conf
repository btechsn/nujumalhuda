# nujumalhuda.conf
# Configuration du reverse proxy pour nujumalhuda.com
# Origine unique : tout passe par un seul domaine avec routage par chemin

upstream php_backend {
    server app:9000;
}

upstream next_frontend {
    server next:3000;
}

upstream reverb_ws {
    server reverb:8080;
}

upstream mediamtx_hls {
    server mediamtx:8888;
}

upstream mediamtx_whep {
    server mediamtx:8889;
}

# Limite de débit pour l'API publique
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    server_name nujumalhuda.com www.nujumalhuda.com;

    # Redirection www → sans www
    if ($host = www.nujumalhuda.com) {
        return 301 https://nujumalhuda.com$request_uri;
    }

    # En production, décommenter pour forcer HTTPS :
    # return 301 https://$server_name$request_uri;

    # MediaMTX appelle ces routes à chaque lecteur : hors quota public.
    location ~ ^/api/v1/webhooks/mediamtx {
        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 10;
        }
    }

    # ── Laravel API (/api/v1, /sanctum, /broadcasting) ───────────────────────
    location ~ ^/(api|sanctum|broadcasting) {
        limit_req zone=api_limit burst=20 nodelay;

        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_temp_file_write_size 256k;
            fastcgi_read_timeout 300;
        }
    }

    # Routes d'authentification : limitation renforcée
    location ~ ^/(api/v1/auth|sanctum/csrf-cookie) {
        limit_req zone=auth_limit burst=3 nodelay;

        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # ── Filament Admin (/institut/administration, /livewire) ─────────────────
    location ~ ^/(institut/administration|livewire) {
        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass php_backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_busy_buffers_size 256k;
        }
    }

    # ── Storage Laravel (médias publics) ─────────────────────────────────────
    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Laravel Reverb WebSocket (/ws) ───────────────────────────────────────
    location /ws {
        proxy_pass http://reverb_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── MediaMTX HLS (/hls) ──────────────────────────────────────────────────
    location /hls/ {
        proxy_pass http://mediamtx_hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    # ── MediaMTX WHEP (/whep) ────────────────────────────────────────────────
    location /whep/ {
        proxy_pass http://mediamtx_whep/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    }

    # ── Next.js frontend (tout le reste) ─────────────────────────────────────
    location / {
        proxy_pass http://next_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    # Sécurité : interdire l'accès aux fichiers sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|log|git|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

