version: '3.9'

services:
  # ── Nginx : reverse proxy unique ──────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nujumalhuda_nginx
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/public:/var/www/backend/public:ro
      - ./backend/storage/app/public:/var/www/backend/storage/app/public:ro
    depends_on:
      - app
      - next
      - reverb
    networks:
      - nujumalhuda
    restart: unless-stopped

  # ── PHP-FPM : Laravel application ─────────────────────────────────────────
  app:
    build:
      context: ./infra/php
      dockerfile: Dockerfile
    container_name: nujumalhuda_app
    env_file:
      - .env
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./frontend/messages:/var/www/frontend/messages:ro
      - ./infra/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./infra/php/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - db
      - redis
    networks:
      - nujumalhuda
      - internal
    restart: unless-stopped

  # ── Queue worker ──────────────────────────────────────────────────────────
  queue:
    build:
      context: ./infra/php
      dockerfile: Dockerfile
    container_name: nujumalhuda_queue
    env_file:
      - .env
    working_dir: /var/www/backend
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www/backend
      - ./infra/php/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_CONNECTION=redis
    depends_on:
      - db
      - redis
    networks:
      - internal
    restart: unless-stopped

  # ── Scheduler ─────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: ./infra/php
      dockerfile: Dockerfile
    container_name: nujumalhuda_scheduler
    env_file:
      - .env
    working_dir: /var/www/backend
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - ./backend:/var/www/backend
      - ./infra/php/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - db
      - redis
    networks:
      - internal
    restart: unless-stopped

  # ── Laravel Reverb : WebSocket server ─────────────────────────────────────
  reverb:
    build:
      context: ./infra/php
      dockerfile: Dockerfile
    container_name: nujumalhuda_reverb
    env_file:
      - .env
    working_dir: /var/www/backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./backend:/var/www/backend
      - ./infra/php/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REVERB_APP_ID=${REVERB_APP_ID}
      - REVERB_APP_KEY=${REVERB_APP_KEY}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - nujumalhuda
      - internal
    restart: unless-stopped

  # ── Next.js : frontend application ────────────────────────────────────────
  next:
    image: node:20-alpine
    container_name: nujumalhuda_next
    working_dir: /app
    command: sh -c "npm install --include=dev && npm run build && npm run start -- -H 0.0.0.0 -p 3000"
    volumes:
      - ./frontend:/app
      - ./design:/design:ro
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://nujumalhuda.com/api/v1
      - NEXT_PUBLIC_WS_URL=wss://nujumalhuda.com/ws
    networks:
      - nujumalhuda
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    container_name: nujumalhuda_db
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=fr_FR.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nujumalhuda_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  nujumalhuda:
    driver: bridge
  internal:
    driver: bridge
    internal: true
